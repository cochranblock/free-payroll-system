# Unlicense — public domain — cochranblock.org
# free-payroll-system — Free, open-source, local-first payroll. No SaaS. No per-employee pricing. Forever.
# Contributors: GotEmCoach, KOVA, Claude Opus 4.7

[package]
name = "free-payroll-system"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Michael Cochran <mcochran@cochranblock.org>"]
description = "Free, open-source, local-first payroll system. No SaaS. No per-employee pricing. Unlicense."
license = "Unlicense"
repository = "https://github.com/cochranblock/free-payroll-system"
homepage = "https://cochranblock.org"
readme = "README.md"
keywords = ["payroll", "small-business", "local-first", "open-source", "free"]
categories = ["command-line-utilities", "finance"]
include = [
    "src/**/*",
    "Cargo.toml",
    "UNLICENSE",
    "README.md",
    "RECEIPTS.md",
    "data/citations.md",
]

default-run = "free-payroll-system"

[[bin]]
name = "free-payroll-system"
path = "src/main.rs"

[[bin]]
name = "free-payroll-system-test"
path = "src/bin/free-payroll-system-test.rs"
required-features = ["tests"]

[lib]
name = "free_payroll_system"
path = "src/lib.rs"

# tests = exopack for TRIPLE SIMS quality gate. Release strips both.
[features]
default = []
tests = ["exopack", "tokio"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
exopack = { version = "0.2", optional = true, features = ["triple_sims"] }
tokio = { version = "1", features = ["full"], optional = true }


# ─── DIAMOND RUST BINARY ARCHITECTURE ───────────────────────────────
# Canonical: https://cochranblock.org/diamond-profile.toml
# free-payroll-system runs on a small-business owner's laptop. Speed-Diamond fits.
#   cargo build --profile=diamond

[profile.diamond]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
debug = false
incremental = false
split-debuginfo = "off"

[profile.diamond-edge]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = false
debug = false
incremental = false
split-debuginfo = "off"
